name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Code examples are welcome.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (src/engine/)
        - Analysis / Metrics (src/core/analysis/)
        - State Preparation (src/core/state_preparation/)
        - Experiments (src/experiments/)
        - API Server (apps/api/)
        - Web Client (apps/client/)
        - CLI
        - Documentation
        - Other
    validations:
      required: true
