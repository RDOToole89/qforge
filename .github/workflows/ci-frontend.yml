name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Design tokens — no raw hex outside src/design
        run: pnpm --filter @qef/client run lint:tokens

      - name: Type check (client)
        run: pnpm --filter @qef/client run typecheck

      - name: Test (client)
        run: pnpm --filter @qef/client test
