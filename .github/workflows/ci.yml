name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --frozen --python ${{ matrix.python-version }}

    - name: Lint and format check with ruff
      run: |
        uv run ruff check src tests
        uv run ruff format --check src tests

    - name: Type check with mypy
      run: uv run mypy src --ignore-missing-imports

    - name: Test with pytest
      # Coverage source, term-missing report, and the 90% gate are configured in
      # pytest.ini. Only add the XML report here for Codecov. Do NOT repeat --cov
      # on the CLI: duplicating it with the addopts entry corrupts measurement.
      run: |
        uv run pytest --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Build documentation
      run: uv run --group docs mkdocs build --strict

    - name: Deploy documentation (main branch only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: uv run --group docs mkdocs gh-deploy --force

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Run security checks with bandit
      run: |
        uv run --group security bandit -r src -f json -o bandit-report.json || true
        uv run --group security bandit -r src

    - name: Check dependencies for security vulnerabilities
      run: |
        uv run --group security safety check --json --output safety-report.json || true
        uv run --group security safety check

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image (smoke test)
      run: docker build -t qforge-api .

  package:
    runs-on: ubuntu-latest
    needs: [test, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Check package
      run: uvx twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
