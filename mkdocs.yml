site_name: QForge
site_description: A general-purpose quantum experiment engine built on Qiskit
site_url: https://RDOToole89.github.io/qforge/
repo_url: https://github.com/RDOToole89/qforge
repo_name: RDOToole89/qforge

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: guides/getting-started/installation.md
    - Quick Start: guides/getting-started/quickstart.md
  - Guides:
    - Hardware Setup: guides/hardware-setup.md
  - API Reference:
    - Metrics: guides/api/metrics.md
    - Constants: guides/api/constants.md
  - Reference:
    - CLI: reference/cli.md
  - Architecture:
    - Overview: architecture/architecture.md
