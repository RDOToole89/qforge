site_name: Quantum Decoherence Analysis Framework
site_description: Research-grade quantum experiment framework for structured decoherence analysis
site_url: https://github.com/your-org/qiskit-experiments

repo_name: qiskit-experiments
repo_url: https://github.com/your-org/qiskit-experiments

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            group_by_category: true
            show_category_heading: true
  - autorefs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Basic Usage: getting-started/basic-usage.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Analysis Metrics: user-guide/metrics.md
    - Information Theory: user-guide/information-theory.md
    - Statistical Methods: user-guide/statistical-methods.md
    - Pipeline Usage: user-guide/pipelines.md
  - API Reference:
    - Constants: api/constants.md
    - Core Modules: api/core.md
    - Metrics: api/metrics.md
    - Registry System: api/registry.md
    - Schema Bridge: api/schema-bridge.md
    - Pipelines: api/pipelines.md
  - Examples:
    - Basic Analysis: examples/basic-analysis.md
    - Temporal Analysis: examples/temporal-analysis.md
    - Emergence Analysis: examples/emergence-analysis.md
    - Custom Metrics: examples/custom-metrics.md
  - Developer Guide:
    - Contributing: developer/contributing.md
    - Architecture: developer/architecture.md
    - Testing: developer/testing.md
    - Release Process: developer/releases.md