[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "qforge"
dynamic = ["version"]
description = "A general-purpose quantum experiment engine built on Qiskit — for learning, research, and real hardware"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Quantum Research Team"}]
requires-python = ">=3.9"
dependencies = [
    "qiskit>=0.45.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",  # For pretty CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "hypothesis>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
    "mkdocs-autorefs>=0.4.1",
]

[project.scripts]
qforge = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools_scm]
write_to = "src/_version.py"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "D", "C901"]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
# Noise models have long docstrings with physics formulas and references
"src/core/noise_models/**" = ["E501"]
# TODO: Refactor these complex functions in Phase 3
"src/core/analysis/metrics/registry.py" = ["C901"]
"src/core/analysis/metrics/entanglement_error_correlation.py" = ["C901"]
"src/core/state_preparation/custom_state.py" = ["C901"]
"src/engine/execution/runner.py" = ["C901"]
"src/engine/persistence/hashing.py" = ["C901"]
"src/experiments/state_probe_sensitivity.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "scipy.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/core/analysis"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
