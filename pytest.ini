[pytest]
# NOTE: section MUST be [pytest] in a pytest.ini file ([tool:pytest] is the
# setup.cfg spelling and is silently ignored here).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=src/core/analysis
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=55
# Coverage of src/core/analysis is ~57%. Raise --cov-fail-under toward 90% as
# analysis tests are added (this gate was previously inert due to a bad section
# header, so it had never actually run).
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across components
    edge_case: Edge case and error handling tests
    property: Mathematical property validation tests
    schema: Schema compliance tests
    slow: Tests that take longer to run
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:numpy.*