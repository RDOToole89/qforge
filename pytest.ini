[pytest]
# NOTE: section MUST be [pytest] in a pytest.ini file ([tool:pytest] is the
# setup.cfg spelling and is silently ignored here).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=95
# Coverage gate spans the whole physics/math core (src/qforge/core), currently ~97%.
# The remaining lines are unreachable defensive guards; keep the gate at 95%.
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across components
    edge_case: Edge case and error handling tests
    property: Mathematical property validation tests
    schema: Schema compliance tests
    slow: Tests that take longer to run
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:numpy.*
